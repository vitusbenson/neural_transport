[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "neural_transport"
authors = [
    {name = "Vitus Benson", email = "vbenson@bgc-jena.mpg.de"},
]
readme = "README.md"
license = {file = "LICENSE"}
description = "Neural Transport - A Python library to train neural network emulators of atmospheric transport models."
keywords = ["AI", "neural network", "transport model", "carbon", "co2", "emulator", "pytorch"]
requires-python = ">=3.10"
version = "0.1.0"
dependencies = [
    "numpy",
    "xarray",
    "dask",
    "ecmwf-api-client",
    "tqdm",
    "xesmf",
    "cdo",
    "numcodecs",
    "zarr",
    "pandas",
    "xskillscore",
    "tensorboard",
    "torch",
    "cartopy",
    "matplotlib",
    "seaborn",
    "xrft",
    "xmovie",
    "torch_geometric",
    "scipy",
    "trimesh",
    "tensorly",
    "torch_harmonics",
    "timm",
    "einops",
    "pyarrow",
    "h5netcdf",
    "netcdf4",
]
[project.urls]
Repository = "https://github.com/vitusbenson/neural_transport.git"
Issues = "https://github.com/vitusbenson/neural_transport/issues"

[tool.setuptools.packages.find]
include = ["neural_transport"]
exclude = ["experiments*"]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E203", "E402", "E501", "E741"]

[tool.ruff.format]
skip-magic-trailing-comma = false
quote-style = "preserve"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "-ra", "-m not slow"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
markers = [
    "slow: marks tests as slow (~5min, full model training)",
    "gpu: marks tests requiring GPU",
    "quick: marks fast sanity tests (~30s)",
]
